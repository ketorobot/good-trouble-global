<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — Good Trouble</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='46' fill='none' stroke='%23D4C6A1' stroke-width='10' stroke-dasharray='255.31 33.72' stroke-dashoffset='-26.01' stroke-linecap='round' transform='rotate(-90 60 60)'/%3E%3Ccircle cx='93' cy='33' r='7' fill='%23D4C6A1'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1220; --bg1:#0C1424; --bg2:#0D1626;
    --sand:#D4C6A1; --brass:#B49A62; --bone:#EFF2F7; --mid:#8CA0BC;
    --dim:rgba(239,242,247,0.55); --dim2:rgba(239,242,247,0.28);
    --line:rgba(212,198,161,0.10); --border:rgba(212,198,161,0.22);
    --panel:rgba(12,20,36,.78);
    --crit:#E23636; --green:#2EE06E; --green-dull:#5a8a6e; --purple:#9B8DD6;
    --font-h:'Cormorant Garamond',Garamond,Georgia,serif; --font-b:'Lato',-apple-system,'Segoe UI',sans-serif;
    --rad:4px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{font-size:17px;}
  body{
    font-family:var(--font-b);background:var(--bg);color:var(--bone);min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 520px at 50% -180px, rgba(212,198,161,.13), transparent 65%),
      radial-gradient(700px 420px at 100% 100%, rgba(180,154,98,.06), transparent 60%),
      radial-gradient(700px 420px at 0% 100%, rgba(140,160,188,.05), transparent 60%);
    background-attachment:fixed;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:1.75rem 1.5rem 4rem;}
  header.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.1rem;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;}
  .brand svg{height:36px;width:36px;display:block;}
  .brand-text{font-family:var(--font-h);font-weight:600;font-size:1.35rem;letter-spacing:.16em;color:var(--bone);text-transform:uppercase;}
  .tabs{display:flex;gap:.35rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--rad);padding:.3rem;backdrop-filter:blur(6px);}
  .tab{font-family:var(--font-b);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:.5rem 1.15rem;border-radius:2px;color:var(--dim);text-decoration:none;transition:.15s;}
  .tab.active{background:var(--sand);color:var(--bg);}
  .tab:not(.active):hover{color:var(--bone);}
  .top-actions{display:flex;gap:.5rem;align-items:center;}
  .btn{font-family:var(--font-b);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--bone);padding:.55rem 1.05rem;border-radius:var(--rad);cursor:pointer;transition:.15s ease;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;}
  .btn:hover{border-color:var(--sand);background:rgba(212,198,161,.08);}
  .btn-primary{background:var(--sand);border-color:var(--sand);color:var(--bg);}
  .btn-primary:hover{background:#E2D6B6;border-color:#E2D6B6;}
  .btn-sheet{border-color:rgba(52,168,83,.4);color:#8fd6ac;}
  .btn-sheet:hover{background:rgba(52,168,83,.12);border-color:#34A853;color:#b8ecc9;}
  .btn-danger{border-color:rgba(226,54,54,.5);color:#ff8b8b;}
  .btn-danger:hover{background:rgba(226,54,54,.12);border-color:#E23636;}

  #banner{display:none;background:rgba(226,54,54,.12);border:1px solid rgba(226,54,54,.4);color:#ff9d9d;padding:.8rem 1rem;border-radius:var(--rad);margin-bottom:1rem;font-size:15px;}

  /* ===== THE GOAL BANNER ===== */
  @keyframes brasspulse{
    0%,100%{box-shadow:0 0 24px rgba(212,198,161,.14), inset 0 0 40px rgba(212,198,161,.04);}
    50%{box-shadow:0 0 52px rgba(212,198,161,.32), inset 0 0 60px rgba(212,198,161,.08);}
  }
  .goal-banner{
    position:relative;text-align:center;border:1px solid var(--sand);border-radius:var(--rad);
    background:radial-gradient(ellipse at center,#141a1e 0%,#0D1626 60%,var(--bg) 100%);
    padding:2.25rem 1.5rem 2rem;margin-bottom:1.5rem;overflow:hidden;
    animation:brasspulse 3.6s ease-in-out infinite;
  }
  .gb-label{font-family:var(--font-b);font-weight:700;font-size:.72rem;letter-spacing:.32em;color:var(--brass);text-transform:uppercase;margin-bottom:.6rem;}
  .gb-goal{font-family:var(--font-h);font-weight:600;font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.05;color:var(--bone);letter-spacing:.02em;margin:.2rem 0 .6rem;}
  .gb-meta{font-size:.9rem;color:var(--sand);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .gb-shelf{font-size:1.6rem;letter-spacing:8px;margin-top:1rem;}
  .gb-stats{font-size:.8rem;color:var(--dim);margin-top:.35rem;letter-spacing:.06em;}
  .gb-trophy-side{position:absolute;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.35;}
  .gb-trophy-side.l{left:2rem;}
  .gb-trophy-side.r{right:2rem;}
  .gb-empty-cta{display:inline-block;margin-top:.5rem;background:var(--sand);color:var(--bg);font-weight:700;padding:.6rem 1.7rem;border-radius:var(--rad);text-decoration:none;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;}
  .gb-empty-cta:hover{background:#E2D6B6;}
  @media(max-width:760px){.gb-trophy-side{display:none;}}

  /* ===== 7-DAY PULSE CHART ===== */
  .pulse{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:1.3rem 1.5rem 1.1rem;margin-bottom:1.5rem;backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .pulse-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem;}
  .pulse-title{font-family:var(--font-h);font-weight:600;font-size:1.5rem;letter-spacing:.04em;color:var(--bone);}
  .pulse-title span{font-family:var(--font-b);font-weight:700;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);margin-left:.8rem;vertical-align:middle;}
  .pulse-legend{display:flex;gap:1.25rem;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .pulse-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.45rem;vertical-align:-1px;}
  .pulse-legend .lg-done i{background:var(--green);}
  .pulse-legend .lg-open i{background:transparent;border:2px solid var(--sand);border-radius:50%;width:9px;height:9px;}
  .pulse-chart{width:100%;height:auto;display:block;overflow:visible;}
  .pulse-chart text{font-family:var(--font-b);}
  .pc-grid{stroke:rgba(239,242,247,.07);stroke-width:1;}
  .pc-axis{fill:var(--dim);font-size:11px;letter-spacing:.06em;}
  .pc-dow{fill:var(--dim);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;}
  .pc-dow.today{fill:var(--sand);}
  .pc-date{fill:var(--bone);font-family:var(--font-h);font-size:17px;font-weight:600;}
  .pc-bar{fill:rgba(239,242,247,.07);stroke:rgba(239,242,247,.14);stroke-width:1;transform-box:fill-box;transform-origin:bottom;animation:barup .6s cubic-bezier(.2,.8,.2,1) both;}
  .pc-bar.today{fill:rgba(212,198,161,.10);stroke:rgba(212,198,161,.35);}
  .pc-barval{fill:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.04em;}
  .pc-line{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:linedraw 1.1s ease-out .2s forwards;}
  .pc-line.alex{stroke:var(--sand);filter:drop-shadow(0 0 6px rgba(212,198,161,.45));}
  .pc-line.augie{stroke:var(--green);filter:drop-shadow(0 0 6px rgba(46,224,110,.45));}
  .pc-area.alex{fill:rgba(212,198,161,.06);} .pc-area.augie{fill:rgba(46,224,110,.06);}
  .pc-dot{stroke:var(--bg);stroke-width:2;opacity:0;animation:dotin .3s ease-out forwards;}
  .pc-dot.alex{fill:var(--sand);} .pc-dot.augie{fill:var(--green);}
  .pc-val{font-family:var(--font-h);font-size:15px;font-weight:700;opacity:0;animation:dotin .3s ease-out forwards;}
  .pc-val.alex{fill:var(--sand);} .pc-val.augie{fill:var(--green);}
  .pc-todayline{stroke:var(--sand);stroke-width:1;stroke-dasharray:3 4;opacity:.5;}
  @keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes linedraw{to{stroke-dashoffset:0}}
  @keyframes dotin{to{opacity:1}}
  .pulse-legend .lg-alex i{background:var(--sand);height:3px;border-radius:2px;vertical-align:2px;}
  .pulse-legend .lg-augie i{background:var(--green);height:3px;border-radius:2px;vertical-align:2px;}
  .pulse-legend .lg-open i{background:rgba(239,242,247,.1);border:1px solid rgba(239,242,247,.3);}
  @media(max-width:760px){.pc-date{font-size:14px;}.pc-val{font-size:13px;}}
  .pulse-line{position:absolute;inset:0;pointer-events:none;overflow:visible;}
  .pulse-foot{display:flex;gap:2rem;flex-wrap:wrap;margin-top:.9rem;padding-top:.75rem;border-top:1px solid var(--line);}
  .pf{font-size:.78rem;color:var(--dim);letter-spacing:.02em;}
  .pf b{font-family:var(--font-h);font-weight:700;font-size:1.25rem;color:var(--bone);margin-right:.3rem;vertical-align:-2px;}
  .pf b.g{color:var(--green);} .pf b.s{color:var(--sand);}
  @media(max-width:760px){.pulse-grid{gap:.3rem;}.pday{padding:.45rem .25rem .4rem;min-height:150px;}.pd-date{font-size:1.1rem;}.pd-done{font-size:1.2rem;}.pd-who{display:none;}.pd-open{font-size:.66rem;}}

  /* ===== TWO COLUMNS ===== */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  @media(max-width:860px){.cols{grid-template-columns:1fr;}}
  .col{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    padding:1.6rem 1.6rem 1.75rem;backdrop-filter:blur(8px);
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .col-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:.7rem;margin-bottom:1.2rem;gap:.6rem;}
  .col-name{font-family:var(--font-h);font-weight:600;font-size:2.4rem;letter-spacing:.14em;color:var(--sand);line-height:1;}
  .col-right{display:flex;align-items:center;gap:.6rem;}
  .col-open{font-size:.72rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-weight:700;}
  .add-toggle{font-size:.7rem;padding:.42rem .95rem;}

  .addrow{display:none;flex-direction:column;gap:.55rem;margin-bottom:1rem;}
  .addrow.open{display:flex;}
  .add-line{display:flex;gap:.55rem;}
  .add-line input{flex:1;background:rgba(10,18,32,.9);color:var(--bone);border:1px solid var(--border);padding:.7rem .85rem;border-radius:var(--rad);font-family:var(--font-b);font-size:16px;}
  .add-line input:focus{outline:none;border-color:var(--sand);}
  .add-line .btn{padding:.6rem 1.15rem;}

  /* ===== DONE TODAY STRIP ===== */
  .today-strip{
    background:linear-gradient(135deg,rgba(46,224,110,.11),rgba(46,224,110,.03));
    border:1px solid rgba(46,224,110,.4);border-radius:var(--rad);
    padding:.85rem 1rem .9rem;margin-bottom:1.25rem;
    box-shadow:0 0 22px rgba(46,224,110,.08), inset 0 0 30px rgba(46,224,110,.03);
  }
  .today-head{font-family:var(--font-b);font-weight:700;font-size:.7rem;letter-spacing:.24em;color:var(--green);text-transform:uppercase;display:flex;align-items:center;gap:.55rem;margin-bottom:.35rem;}
  .today-head::after{content:'';flex:1;height:1px;background:var(--green);opacity:.3;}
  .today-count{font-size:.66rem;font-weight:900;background:var(--green);color:#08210f;border-radius:10px;padding:.12rem .6rem;letter-spacing:.5px;}
  .today-strip .trow{padding:.45rem .35rem;}
  .today-strip .trow .ttext{text-decoration:none;color:#c8f5d8;font-weight:400;font-size:1.05rem;opacity:1;}
  .today-strip .trow{opacity:1;}
  .today-empty{font-size:.85rem;color:var(--dim);font-style:italic;padding:.2rem .25rem 0;}
  .tstamp{font-size:.68rem;color:var(--green-dull);font-weight:700;letter-spacing:.06em;white-space:nowrap;margin-left:auto;padding-left:.6rem;}

  /* ===== REQUEST SECTION ADD ===== */
  .sec-add{font-family:var(--font-b);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.32rem .85rem;border-radius:var(--rad);border:1px solid rgba(155,141,214,.55);background:transparent;color:#cfc4f2;cursor:pointer;transition:.15s;white-space:nowrap;}
  .sec-add:hover{background:var(--purple);border-color:var(--purple);color:#fff;}
  .reqrow{display:none;gap:.55rem;margin:.15rem 0 .7rem;}
  .reqrow.open{display:flex;}
  .reqrow input{flex:1;background:rgba(10,18,32,.9);color:var(--bone);border:1px solid rgba(155,141,214,.4);padding:.7rem .85rem;border-radius:var(--rad);font-family:var(--font-b);font-size:16px;}
  .reqrow input:focus{outline:none;border-color:var(--purple);}
  .reqrow .btn{padding:.6rem 1.15rem;background:var(--purple);border-color:var(--purple);color:#fff;}

  /* ===== DONE CELEBRATION ===== */
  .celeb-burst{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden;}
  .celeb-word{
    position:absolute;left:50%;
    font-family:var(--font-h);font-weight:700;font-size:clamp(3.5rem,11vw,8rem);
    letter-spacing:.06em;white-space:nowrap;text-transform:uppercase;
    transform:translate(-50%,-50%) scale(.2) rotate(var(--tilt,0deg));
    animation:celebpop 1.35s cubic-bezier(.18,1.4,.4,1) forwards;
    text-shadow:0 0 40px var(--cglow,rgba(46,224,110,.8)), 0 4px 0 rgba(0,0,0,.6);
  }
  @keyframes celebpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--tilt,0deg));}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(var(--tilt,0deg));}
    30%{transform:translate(-50%,-50%) scale(1) rotate(var(--tilt,0deg));}
    78%{opacity:1;transform:translate(-50%,-52%) scale(1.02) rotate(var(--tilt,0deg));}
    100%{opacity:0;transform:translate(-50%,-64%) scale(1.1) rotate(var(--tilt,0deg));}
  }
  .cf{position:absolute;top:-4vh;width:10px;height:16px;border-radius:2px;opacity:.95;animation:cfall var(--dur,1.4s) linear var(--delay,0s) forwards;transform:rotate(var(--rot,0deg));}
  @keyframes cfall{
    0%{transform:translateY(0) rotate(var(--rot,0deg));opacity:1;}
    100%{transform:translateY(115vh) rotate(calc(var(--rot,0deg) + 540deg));opacity:.6;}
  }
  .cm{
    position:absolute;left:50%;top:52%;font-size:var(--sz,30px);opacity:0;
    animation:cmboom var(--dur,1.7s) cubic-bezier(.16,.7,.35,1) var(--delay,0s) forwards;
    filter:drop-shadow(0 0 8px rgba(212,198,161,.55));
    will-change:transform,opacity;
  }
  @keyframes cmboom{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0deg);}
    8%{opacity:1;}
    30%{opacity:1;transform:translate(calc(-50% + var(--dx,0vw)),calc(-50% + var(--dy,-20vh))) scale(1.25) rotate(var(--spin,180deg));}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0vw)*1.2),calc(-50% + var(--dy,-20vh) + 85vh)) scale(.95) rotate(calc(var(--spin,180deg)*2));}
  }
  .cm-flash{
    position:absolute;left:50%;top:52%;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle,rgba(243,233,207,.95) 0%,rgba(212,198,161,.55) 40%,rgba(212,198,161,0) 70%);
    transform:translate(-50%,-50%);animation:cmflash .55s ease-out forwards;pointer-events:none;
  }
  @keyframes cmflash{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(38);}
  }

  .sec{font-family:var(--font-b);font-weight:700;font-size:.7rem;letter-spacing:.24em;margin:1.35rem 0 .55rem;text-transform:uppercase;display:flex;align-items:center;gap:.55rem;}
  .sec::after{content:'';flex:1;height:1px;background:currentColor;opacity:.18;}
  .sec.now{color:var(--green);}
  .sec.req{color:#cfc4f2;}
  .sec.recent{color:var(--green-dull);}
  .sec:first-of-type{margin-top:0;}

  .trow{display:flex;align-items:center;gap:.8rem;padding:.7rem .5rem;border-radius:var(--rad);transition:.13s;cursor:pointer;}
  .trow:hover{background:rgba(239,242,247,.04);}
  .trow.finished{opacity:.45;}
  .tdot{width:10px;height:10px;min-width:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(46,224,110,.55);}
  .tdot.req{background:var(--purple);box-shadow:0 0 10px rgba(155,141,214,.5);}
  .tdot.blocked{background:var(--crit);box-shadow:0 0 10px rgba(226,54,54,.55);}
  .tdot.check{background:transparent;box-shadow:none;color:var(--green-dull);font-weight:900;font-size:17px;width:17px;min-width:17px;height:auto;border-radius:0;line-height:1;}
  .tbody{flex:1;min-width:0;}
  .ttext{font-family:var(--font-h);font-size:1.32rem;font-weight:600;line-height:1.3;color:var(--bone);}
  .trow.finished .ttext{text-decoration:line-through;font-weight:500;font-size:1.1rem;color:var(--green-dull);}
  .blocked-tag{font-family:var(--font-b);color:#ff9d9d;font-weight:700;font-size:.64rem;letter-spacing:.12em;margin-left:.5rem;vertical-align:middle;}
  .badge-both{font-family:var(--font-b);background:rgba(212,198,161,.14);color:var(--sand);font-size:.58rem;font-weight:700;padding:2px 9px;border-radius:2px;letter-spacing:.14em;text-transform:uppercase;vertical-align:middle;margin-left:.4rem;}
  .done-btn{font-family:var(--font-b);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.4rem .95rem;border-radius:var(--rad);border:1px solid rgba(46,224,110,.55);background:transparent;color:#9af0bd;cursor:pointer;transition:.15s;white-space:nowrap;}
  .done-btn:hover{background:var(--green);border-color:var(--green);color:#08210f;}
  .col-empty{color:var(--dim);font-size:.9rem;padding:.45rem .5rem;font-style:italic;}

  /* Modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(4,8,16,.75);z-index:50;align-items:center;justify-content:center;padding:1.25rem;}
  .overlay.open{display:flex;}
  .modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--rad);width:100%;max-width:460px;padding:1.5rem;max-height:90vh;overflow-y:auto;position:relative;}
  .modal h2{font-family:var(--font-h);font-weight:600;font-size:1.6rem;color:var(--sand);margin-bottom:1rem;letter-spacing:.04em;}
  .field{margin-bottom:.85rem;}
  .field label{display:block;font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-bottom:.32rem;font-weight:700;}
  .field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;background:var(--bg);color:var(--bone);border:1px solid var(--border);padding:.6rem .7rem;border-radius:var(--rad);font-family:var(--font-b);font-size:15px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sand);}
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:.6rem;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;gap:.5rem;}
  .modal-actions .right{display:flex;gap:.45rem;}
  .close-x{position:absolute;top:.9rem;right:1.1rem;cursor:pointer;color:var(--dim);font-size:21px;line-height:1;}

  .toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--bg1);border:1px solid var(--sand);color:var(--bone);padding:.8rem 1.15rem;border-radius:var(--rad);font-size:15px;z-index:60;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIDEtxmss_wbTIOLwyMoMwtb8WIbTYF9XmicYLT7HuqCHG1B7yquxSLADel3E16EYq/exec';
const FALLBACK = {
  owners: ['Alex','Augie','Both'],
  categories: ['Sales & Outreach','Demo Build','Website / Dev','Content & Copy','Client Delivery','Admin & Ops','Product / Automation','Design & Brand','Finance & Legal','Miami Expansion','Miscellaneous','Request'],
  priorities: ['None','Low','Medium','High','Critical'],
  statuses: ['In Progress','Blocked','Done']
};
let TASKS=[], META=FALLBACK, CURRENT_GOAL=null, WEEKLY_GOALS=[], EDITING_ID=null;
const OPEN_ADDS={}, OPEN_REQS={};
const $ = id => document.getElementById(id);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d)return''; const dt=new Date(d.slice(0,10)+'T00:00:00'); return isNaN(dt)?d:dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function statusLabel(s){ return (s==='In Progress'||s==='Not Started'||s==='')?'Active':s; }
function toast(m,e){ const t=$('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); setTimeout(()=>{t.className='toast';},2200); }
function showBanner(m){ const b=$('banner'); b.innerHTML=m; b.style.display='block'; }

async function load(){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'Unknown error');
    TASKS = data.tasks||[];
    if(data.meta) META = data.meta;
    if(META.categories && META.categories.indexOf('Request')===-1) META.categories.push('Request');
    META.statuses = ['In Progress','Blocked','Done'];
    CURRENT_GOAL = data.currentGoal||null;
    WEEKLY_GOALS = data.weeklyGoals||[];
    $('banner').style.display='none';
    fillModalSelects();
    renderBanner();
    renderPulse();
    renderCols();
  }catch(err){ showBanner('Could not load — '+err.message); }
}
async function api(payload){
  const res = await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const data = await res.json();
  if(!data.ok) throw new Error(data.error||'Save failed');
  return data;
}

/* ===== GOAL BANNER (team goal — no owner) ===== */
function goalIcon(s){ return {Pass:'🏆',Fail:'💀',Missed:'🚫'}[s]||'⏳'; }
function renderBanner(){
  const el=$('goalBanner');
  const history = WEEKLY_GOALS.filter(g=>g.status!=='Active');
  const passCount = history.filter(g=>g.status==='Pass').length;
  let streak=0; for(const g of history){ if(g.status==='Pass')streak++; else break; }
  const shelf = history.slice(0,10).map(g=>goalIcon(g.status)).reverse().join(' ');
  let html = '<span class="gb-trophy-side l">🏆</span><span class="gb-trophy-side r">🏆</span>';
  html += '<div class="gb-label">🏆 This Week\'s Goal 🏆</div>';
  if(CURRENT_GOAL){
    html += '<div class="gb-goal">'+esc(CURRENT_GOAL.goal)+'</div>'+
      '<div class="gb-meta">Due '+esc(fmtDate(CURRENT_GOAL.weekEnding))+' (Sunday)</div>';
  }else{
    html += '<div class="gb-goal" style="color:var(--muted);">No goal set</div>'+
      '<a class="gb-empty-cta" href="/status-manage">Set this week\'s goal →</a>';
  }
  if(history.length){
    html += '<div class="gb-shelf">'+shelf+'</div>'+
      '<div class="gb-stats">'+passCount+'/'+history.length+' weeks won'+(streak>0?' · '+streak+' in a row':'')+'</div>';
  }
  el.innerHTML = html;
}


/* ===== 7-DAY PULSE (rolling: completed per day vs open backlog at end of day) ===== */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseAnyDate(s){
  if(!s) return null; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  const d=new Date(s); return isNaN(d)?null:ymd(d);
}
function renderPulse(){
  const el=$('pulse'); if(!el) return;
  const today=ymd(new Date());
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const rows=days.map(d=>{
    const key=ymd(d);
    const done=TASKS.filter(t=>t.status==='Done'&&parseAnyDate(t.completedAt)===key);
    const open=TASKS.filter(t=>{
      const c=parseAnyDate(t.createdAt); if(c&&c>key) return false;
      if(t.status==='Done'){ const f=parseAnyDate(t.completedAt); return f?f>key:false; }
      return true;
    });
    // "Both" tasks count toward each person
    const alex=done.filter(t=>t.owner==='Alex'||t.owner==='Both').length;
    const augie=done.filter(t=>t.owner==='Augie'||t.owner==='Both').length;
    return {d,key,done:done.length,open:open.length,alex,augie};
  });
  const totalDone=rows.reduce((a,r)=>a+r.done,0);
  const openNow=rows[6].open, delta=openNow-rows[0].open;
  const aTot=rows.reduce((a,r)=>a+r.alex,0), uTot=rows.reduce((a,r)=>a+r.augie,0);
  const best=rows.reduce((a,r)=>r.done>a.done?r:a,rows[0]);

  /* --- SVG geometry --- */
  const W=720,H=250, L=34,R=16,T=34,B=52;
  const cw=(W-L-R)/7, plotH=H-T-B;
  const maxLine=Math.max(1,...rows.map(r=>Math.max(r.alex,r.augie)));
  const maxOpen=Math.max(1,...rows.map(r=>r.open));
  const yL=v=>T+plotH-(v/maxLine)*plotH;           // left axis: completed
  const yO=v=>T+plotH-(v/maxOpen)*plotH*.85;       // bars scaled to 85% so lines read on top
  const cx=i=>L+cw*i+cw/2;
  const smooth=(pts)=>pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
  const aPts=rows.map((r,i)=>[cx(i),yL(r.alex)]), uPts=rows.map((r,i)=>[cx(i),yL(r.augie)]);
  const base=T+plotH;
  let svg='<svg class="pulse-chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tasks completed per day by Alex and Augie vs open tasks">';
  // gridlines + left axis ticks
  const ticks=maxLine<=4?maxLine:4;
  for(let k=0;k<=ticks;k++){ const v=Math.round(maxLine*k/ticks), y=yL(v);
    svg+='<line class="pc-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>';
    svg+='<text class="pc-axis" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'; }
  // open bars
  rows.forEach((r,i)=>{ const x=L+cw*i+cw*.22, w=cw*.56, y=yO(r.open), isT=r.key===today;
    svg+='<rect class="pc-bar'+(isT?' today':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+(base-y)+'" rx="2" style="animation-delay:'+(i*.05)+'s"/>';
    svg+='<text class="pc-barval" x="'+cx(i)+'" y="'+(y+15)+'" text-anchor="middle">'+r.open+' open</text>'; });
  // areas + lines
  const area=(pts)=>smooth(pts)+' L'+pts[pts.length-1][0]+','+base+' L'+pts[0][0]+','+base+' Z';
  svg+='<path class="pc-area alex" d="'+area(aPts)+'"/><path class="pc-area augie" d="'+area(uPts)+'"/>';
  svg+='<path class="pc-line alex" d="'+smooth(aPts)+'"/><path class="pc-line augie" d="'+smooth(uPts)+'"/>';
  // dots + values (offset so overlapping values don't collide)
  rows.forEach((r,i)=>{ const x=cx(i), ya=yL(r.alex), yu=yL(r.augie), same=r.alex===r.augie, dl=(.45+i*.11)+'s';
    svg+='<circle class="pc-dot alex" cx="'+x+'" cy="'+ya+'" r="4.5" style="animation-delay:'+dl+'"/>';
    svg+='<circle class="pc-dot augie" cx="'+x+'" cy="'+yu+'" r="4.5" style="animation-delay:'+dl+'"/>';
    const ax=same?x-9:x, ux=same?x+9:x, aAnch=same?'end':'middle', uAnch=same?'start':'middle';
    const ay=ya-10, uy=(same||Math.abs(ya-yu)<14)?(yu<=ya?yu-10:yu+18):yu-10;
    svg+='<text class="pc-val alex" x="'+ax+'" y="'+ay+'" text-anchor="'+aAnch+'" style="animation-delay:'+dl+'">'+r.alex+'</text>';
    svg+='<text class="pc-val augie" x="'+ux+'" y="'+uy+'" text-anchor="'+uAnch+'" style="animation-delay:'+dl+'">'+r.augie+'</text>'; });
  // x labels
  rows.forEach((r,i)=>{ const x=cx(i), isT=r.key===today;
    if(isT) svg+='<line class="pc-todayline" x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+base+'"/>';
    svg+='<text class="pc-dow'+(isT?' today':'')+'" x="'+x+'" y="'+(base+18)+'" text-anchor="middle">'+(isT?'TODAY':r.d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase())+'</text>';
    svg+='<text class="pc-date" x="'+x+'" y="'+(base+38)+'" text-anchor="middle">'+r.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</text>'; });
  svg+='</svg>';

  let html='<div class="pulse-head"><div class="pulse-title">Last 7 Days<span>Completed per day vs. open</span></div>'+
    '<div class="pulse-legend"><span class="lg-alex"><i></i>Alex done</span><span class="lg-augie"><i></i>Augie done</span><span class="lg-open"><i></i>Open (end of day)</span></div></div>'+
    '<div style="font-size:.68rem;color:var(--dim2);margin:-.5rem 0 .6rem;letter-spacing:.04em">Tasks owned by Both count for each person.</div>';
  html+=svg;
  html+='<div class="pulse-foot">'+
    '<span class="pf"><b class="g">'+totalDone+'</b>completed this week</span>'+
    '<span class="pf"><b class="s">'+aTot+'</b>Alex · <b class="g">'+uTot+'</b>Augie</span>'+
    '<span class="pf"><b class="s">'+openNow+'</b>open right now</span>'+
    '<span class="pf"><b>'+(delta>0?'+':'')+delta+'</b>backlog vs. 7 days ago</span>'+
    (best.done?'<span class="pf"><b>'+best.d.toLocaleDateString('en-US',{weekday:'long'})+'</b>best day ('+best.done+')</span>':'')+
    '</div>';
  el.innerHTML=html;
}

/* ===== COLUMNS ===== */
function renderCols(){
  const people = META.owners.filter(o=>o!=='Both');
  const weekAgo = (()=>{const d=new Date();d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  const priOrder = p => ({Critical:0,High:1,Medium:2,Low:3,None:4}[p]??5);

  const row = (t, kind) => {
    // kind: 'now' | 'req' | 'done'
    const finished = kind==='done';
    const blocked = !finished && t.status==='Blocked';
    const dot = finished ? '<span class="tdot check">✓</span>'
      : kind==='req' ? '<span class="tdot req"></span>'
      : blocked ? '<span class="tdot blocked"></span>'
      : '<span class="tdot"></span>';
    return '<div class="trow'+(finished?' finished':'')+'" data-id="'+t.id+'">'+dot+
      '<div class="tbody"><div class="ttext">'+esc(t.task)+
      (t.owner==='Both'?'<span class="badge-both">Both</span>':'')+
      (blocked?'<span class="blocked-tag">⛔ BLOCKED</span>':'')+
      '</div></div>'+
      (!finished?'<button class="done-btn" data-done="'+t.id+'">Done</button>':'')+
      '</div>';
  };

  const dayAgo = (()=>{const d=new Date(Date.now()-86400000);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');})();

  const todayRow = t => {
    const hm = (t.completedAt||'').slice(11,16);
    return '<div class="trow" data-id="'+t.id+'"><span class="tdot check">✓</span>'+
      '<div class="tbody"><div class="ttext">'+esc(t.task)+
      (t.owner==='Both'?'<span class="badge-both">Both</span>':'')+'</div></div>'+
      '<span class="tstamp">'+esc(hm)+'</span></div>';
  };

  const col = person => {
    const mine = TASKS.filter(t=>t.owner===person||t.owner==='Both');
    const open = mine.filter(t=>t.status!=='Done');
    const now = open.filter(t=>t.category!=='Request')
      .sort((a,b)=>priOrder(a.priority)-priOrder(b.priority));
    const reqs = open.filter(t=>t.category==='Request')
      .sort((a,b)=>{const da=a.dueDate||'9999',db=b.dueDate||'9999';return da<db?-1:da>db?1:priOrder(a.priority)-priOrder(b.priority);});
    const doneAll = mine.filter(t=>t.status==='Done'&&t.completedAt);
    const doneToday = doneAll.filter(t=>t.completedAt>=dayAgo)
      .sort((a,b)=>a.completedAt<b.completedAt?1:-1);
    const recent = doneAll.filter(t=>t.completedAt<dayAgo&&t.completedAt.slice(0,10)>=weekAgo)
      .sort((a,b)=>a.completedAt<b.completedAt?1:-1).slice(0,10);
    return '<div class="col">'+
      '<div class="col-head"><span class="col-name">'+esc(person).toUpperCase()+'</span>'+
      '<span class="col-right"><span class="col-open">'+open.length+' open</span>'+
      '<button class="btn btn-primary add-toggle" data-addtoggle="'+esc(person)+'">+ Add</button></span></div>'+
      '<div class="addrow'+(OPEN_ADDS[person]?' open':'')+'" data-addrow="'+esc(person)+'">'+
      '<div class="add-line">'+
      '<input type="text" placeholder="What are you working on?" data-addinput="'+esc(person)+'" autocomplete="off">'+
      '<button class="btn btn-primary" data-addgo="'+esc(person)+'">Go</button></div></div>'+
      '<div class="today-strip">'+
      '<div class="today-head">⚡ Done Today'+(doneToday.length?'<span class="today-count">'+doneToday.length+'</span>':'')+'</div>'+
      (doneToday.length?doneToday.map(todayRow).join(''):'<div class="today-empty">No kills yet today.</div>')+
      '</div>'+
      '<div class="sec now">Active</div>'+
      (now.length?now.map(t=>row(t,'now')).join(''):'<div class="col-empty">Nothing in motion.</div>')+
      '<div class="sec req"><span>Requests</span><button class="sec-add" data-reqtoggle="'+esc(person)+'">+ Request</button></div>'+
      '<div class="reqrow'+(OPEN_REQS[person]?' open':'')+'" data-reqrow="'+esc(person)+'">'+
      '<input type="text" placeholder="What do you need from '+esc(person)+'?" data-reqinput="'+esc(person)+'" autocomplete="off">'+
      '<button class="btn" data-reqgo="'+esc(person)+'">Ask</button></div>'+
      (reqs.length?reqs.map(t=>row(t,'req')).join(''):'<div class="col-empty">No requests waiting.</div>')+
      '<div class="sec recent">Completed</div>'+
      (recent.length?recent.map(t=>row(t,'done')).join(''):'<div class="col-empty">Nothing else this week.</div>')+
      '</div>';
  };
  $('cols').innerHTML = people.map(col).join('');
  Object.keys(OPEN_ADDS).forEach(p=>{
    if(OPEN_ADDS[p]){ const inp=document.querySelector('[data-addinput="'+p+'"]'); if(inp)inp.focus(); }
  });
}

/* ===== INLINE ADD (task) ===== */
async function addWorking(person){
  const inp=document.querySelector('[data-addinput="'+person+'"]');
  const text=(inp?inp.value:'').trim();
  if(!text) return;
  inp.value='';
  const tempId='temp-'+Date.now();
  const nowIso=new Date().toISOString().slice(0,16).replace('T',' ');
  TASKS.unshift({id:tempId, owner:person, task:text, category:'Miscellaneous', dueDate:todayStr(),
    priority:'None', status:'In Progress', createdAt:nowIso, notes:'', completedAt:''});
  renderCols();
  try{
    await api({action:'quickLog', kind:'doing', text:text, owner:person});
    toast('→ On the board');
    load();
  }
  catch(err){ TASKS=TASKS.filter(t=>t.id!==tempId); renderCols(); if(inp)inp.value=text; toast('Failed: '+err.message,true); }
}

/* ===== INLINE ADD (request — lives under the Requests header) ===== */
async function addRequest(person){
  const inp=document.querySelector('[data-reqinput="'+person+'"]');
  const text=(inp?inp.value:'').trim();
  if(!text) return;
  inp.value='';
  const tempId='temp-'+Date.now();
  const nowIso=new Date().toISOString().slice(0,16).replace('T',' ');
  TASKS.unshift({id:tempId, owner:person, task:text, category:'Request', dueDate:todayStr(),
    priority:'None', status:'In Progress', createdAt:nowIso, notes:'', completedAt:''});
  renderCols();
  try{
    await api({action:'add', owner:person, task:text, category:'Request', dueDate:'', priority:'None', status:'In Progress', notes:''});
    toast('→ Request filed for '+person);
    // Fire-and-forget email bump to the person being asked (no-op until Apps Script has notifyRequest)
    api({action:'notifyRequest', owner:person, task:text}).catch(()=>{});
    load();
  }
  catch(err){ TASKS=TASKS.filter(t=>t.id!==tempId); renderCols(); if(inp)inp.value=text; toast('Failed: '+err.message,true); }
}

/* ===== DONE BUTTON + CELEBRATION ===== */
const CELEB_WORDS=['FUCK YEAH.','GET IT.','ICED OUT ❄️','ANOTHER ONE.','COLD. BLOODED.','SENT.','CERTIFIED.','BAG SECURED 💰','LETHAL.','NO CRUMBS.','DEMOLISHED.','EASY MONEY.','CLEAN KILL.','MENACE BEHAVIOR.','WHO\'S NEXT?','BUILT DIFFERENT.','MISSION FUCKING DONE.','LOCKED IN 🔒','STACKS SECURED 💵','BODY COUNT UP.','DRIP CHECK ✅','ZERO TRACE.','ELITE WORK.','GHOST MODE. 👻','BAG DIFFERENT.','CASHED OUT 💸','UNTOUCHABLE.','FLAWLESS.','SMOKE CLEARED.','TOP TIER SHIT.','HANDS CLEAN.','VICTORY LAP 🏁','MURDERED IT.','NO COMPETITION.','PLOT CLOSED.','KING SHIT. 👑','NEXT.','DOMINATED.','SILENCE THE NOISE.','BOSS SHIT ONLY.','UNDEFEATED.','MIC DROP. 🎤','OUTTA HERE.','LEGENDARY EXECUTION.','BAGS SECURED 💰','GOLD STANDARD.','STACKS ON DECK.','WEALTH MODE.','DRIPPING IN GOLD.','RICH MOVES ONLY.','PAPER CHASE COMPLETE.','LUXURY SECURED.','STACKS NEVER SLEEP.','GOLDEN TOUCH.','MONEY TALKS.','HIGH NET WORTH.','BAG AFTER BAG.','SWAGGER LOADED.','CASH FLOWING.','RICH BLOOD.','GOLD ALL DAY.','WEALTH UNLOCKED.','LIVING LARGE.','MONEY NEVER STOPS.','PLATINUM STATUS.','BAGS HEAVY.','GOLDEN ERA.','RICH LIFE ONLY.'];
const CELEB_COLORS=[
  ['#2ee06e','rgba(46,224,110,.8)'],['#B49A62','rgba(180,154,98,.85)'],
  ['#D4C6A1','rgba(212,198,161,.85)'],['#9b6dd6','rgba(155,109,214,.85)'],
  ['#4dd8ff','rgba(77,216,255,.8)'],['#ff4d88','rgba(255,77,136,.8)']
];
let lastCeleb=-1;
function celebrate(){
  let wi; do{ wi=Math.floor(Math.random()*CELEB_WORDS.length); }while(wi===lastCeleb&&CELEB_WORDS.length>1);
  lastCeleb=wi;
  const [color,glow]=CELEB_COLORS[Math.floor(Math.random()*CELEB_COLORS.length)];
  const tilt=(Math.random()*10-5).toFixed(1);
  const top=(36+Math.random()*14).toFixed(0);
  let html='<div class="celeb-word" style="color:'+color+';--cglow:'+glow+';--tilt:'+tilt+'deg;top:'+top+'%">'+CELEB_WORDS[wi]+'</div>';
  /* gold flash at detonation point */
  html+='<div class="cm-flash"></div>';
  /* wealth explosion — money, gold, diamonds bursting outward then raining down */
  const RICHES=['💰','💎','🪙','💵','💸','👑','🏆','✨','💍','🥇'];
  for(let i=0;i<30;i++){
    const dx=(Math.random()*90-45).toFixed(1);
    const dy=-(8+Math.random()*34).toFixed(1);
    html+='<span class="cm" style="--dx:'+dx+'vw;--dy:'+dy+'vh;--spin:'+(Math.random()*520-260).toFixed(0)+'deg;'+
      '--sz:'+(20+Math.random()*26).toFixed(0)+'px;--dur:'+(1.4+Math.random()*.7).toFixed(2)+'s;--delay:'+(Math.random()*.12).toFixed(2)+'s">'+
      RICHES[i%RICHES.length]+'</span>';
  }
  const palette=['#D4C6A1','#B49A62','#EFF2F7','#2ee06e','#8CA0BC','#4dd8ff','#F3E9CF'];
  for(let i=0;i<44;i++){
    html+='<span class="cf" style="left:'+(Math.random()*100).toFixed(1)+'vw;background:'+palette[i%palette.length]+
      ';--dur:'+(1.1+Math.random()*.9).toFixed(2)+'s;--delay:'+(Math.random()*.25).toFixed(2)+'s;--rot:'+Math.floor(Math.random()*360)+'deg;'+
      'width:'+(6+Math.random()*8).toFixed(0)+'px;height:'+(10+Math.random()*10).toFixed(0)+'px"></span>';
  }
  const burst=document.createElement('div');
  burst.className='celeb-burst';
  burst.innerHTML=html;
  document.body.appendChild(burst);
  setTimeout(()=>{ burst.remove(); },2700);
}
async function markDone(id){
  const t = TASKS.find(x=>x.id===id);
  if(!t||t.status==='Done') return;
  const prevStatus=t.status;
  t.status='Done';
  t.completedAt=new Date().toISOString().slice(0,16).replace('T',' ');
  celebrate();
  renderCols();
  try{ await api({action:'update', id:id, status:'Done'}); load(); }
  catch(err){ t.status=prevStatus; t.completedAt=''; renderCols(); toast('Failed: '+err.message,true); }
}

/* ===== MODAL ===== */
function fillModalSelects(){
  const fill=(sel,items,labelFn)=>{const v=sel.value;sel.innerHTML='';items.forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=labelFn?labelFn(i):i;sel.appendChild(o);});if(v)sel.value=v;};
  fill($('fOwnerInput'),META.owners);
  fill($('fCategoryInput'),META.categories);
  fill($('fPriorityInput'),META.priorities);
  fill($('fStatusInput'),META.statuses,statusLabel);
}
function openModal(t){
  EDITING_ID=t.id;
  $('fTask').value=t.task;
  $('fOwnerInput').value=t.owner;
  $('fPriorityInput').value=t.priority;
  $('fCategoryInput').value=t.category;
  $('fDateInput').value=(t.dueDate||'').slice(0,10);
  $('fStatusInput').value=(t.status==='Not Started'||t.status==='')?'In Progress':t.status;
  $('fNotesInput').value=t.notes||'';
  $('overlay').classList.add('open');
}
function closeModal(){ $('overlay').classList.remove('open'); EDITING_ID=null; }
async function handleSave(){
  if(!EDITING_ID) return;
  try{
    $('saveBtn').textContent='Saving…';
    await api({action:'update', id:EDITING_ID, owner:$('fOwnerInput').value, task:$('fTask').value.trim(),
      category:$('fCategoryInput').value, dueDate:$('fDateInput').value||'', priority:$('fPriorityInput').value,
      status:$('fStatusInput').value, notes:$('fNotesInput').value});
    closeModal(); toast('Updated'); load();
  }catch(err){ toast('Failed: '+err.message,true); }
  finally{ $('saveBtn').textContent='Save'; }
}
async function handleDelete(){
  if(!EDITING_ID||!confirm('Delete this task?'))return;
  try{ await api({action:'delete',id:EDITING_ID}); closeModal(); toast('Deleted'); load(); }
  catch(err){ toast('Failed: '+err.message,true); }
}

/* ===== EVENTS ===== */
$('cols').addEventListener('click',e=>{
  const tg=e.target.closest('[data-addtoggle]');
  if(tg){ const p=tg.dataset.addtoggle; OPEN_ADDS[p]=!OPEN_ADDS[p];
    const r=document.querySelector('[data-addrow="'+p+'"]'); r.classList.toggle('open',OPEN_ADDS[p]);
    if(OPEN_ADDS[p]){ const inp=document.querySelector('[data-addinput="'+p+'"]'); if(inp)inp.focus(); }
    return; }
  const rt=e.target.closest('[data-reqtoggle]');
  if(rt){ const p=rt.dataset.reqtoggle; OPEN_REQS[p]=!OPEN_REQS[p];
    const r=document.querySelector('[data-reqrow="'+p+'"]'); r.classList.toggle('open',OPEN_REQS[p]);
    if(OPEN_REQS[p]){ const inp=document.querySelector('[data-reqinput="'+p+'"]'); if(inp)inp.focus(); }
    return; }
  const go=e.target.closest('[data-addgo]');
  if(go){ addWorking(go.dataset.addgo); return; }
  const rg=e.target.closest('[data-reqgo]');
  if(rg){ addRequest(rg.dataset.reqgo); return; }
  const dn=e.target.closest('[data-done]');
  if(dn){ e.stopPropagation(); markDone(dn.dataset.done); return; }
  const r=e.target.closest('.trow');
  if(r){ const t=TASKS.find(x=>x.id===r.dataset.id); if(t&&String(t.id).indexOf('temp-')!==0)openModal(t); }
});
$('cols').addEventListener('keydown',e=>{
  const inp=e.target.closest('[data-addinput]');
  if(inp&&e.key==='Enter'){ e.preventDefault(); addWorking(inp.dataset.addinput); return; }
  const rinp=e.target.closest('[data-reqinput]');
  if(rinp&&e.key==='Enter'){ e.preventDefault(); addRequest(rinp.dataset.reqinput); }
});
$('closeModal').addEventListener('click',closeModal);
$('cancelBtn').addEventListener('click',closeModal);
$('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeModal(); });
$('saveBtn').addEventListener('click',handleSave);
$('deleteBtn').addEventListener('click',handleDelete);

load();
setInterval(load,60000);
